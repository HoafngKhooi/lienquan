name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Debug environment
        run: |
          echo "=== Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "PWD=$(pwd)"
          echo "=== sdkmanager ==="
          which sdkmanager || echo "MISSING from PATH"
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin/" 2>&1 || echo "cmdline-tools missing"
          echo "=== SDK contents ==="
          ls -la "$ANDROID_HOME" 2>&1 || true

      - name: Install SDK platforms
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "FATAL: sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Verify SDK install
        run: |
          ls -la "$ANDROID_HOME/platforms/android-34/" 2>&1 | head -5
          ls -la "$ANDROID_HOME/build-tools/34.0.0/" 2>&1 | head -5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
